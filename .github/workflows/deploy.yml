name: Deploy serverless

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: the-crunch
  APP_SECRET_NAME: the-crunch/app-env

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Validate app before deploy
        run: bun run check

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::265058000489:role/github-actions-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --image-scanning-configuration scanOnPush=true

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Upsert runtime secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TWITTER_CLIENT: ${{ secrets.TWITTER_CLIENT }}
          TWITTER_SECRET: ${{ secrets.TWITTER_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
          PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: ${{ secrets.PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE }}
          PUBLIC_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE: ${{ secrets.PUBLIC_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE }}
        run: |
          EXISTING_SECRET="$(aws secretsmanager get-secret-value \
            --secret-id "$APP_SECRET_NAME" \
            --query SecretString \
            --output text 2>/dev/null || echo '{}')"

          if [ -z "$EXISTING_SECRET" ] || [ "$EXISTING_SECRET" = "None" ]; then
            EXISTING_SECRET="{}"
          fi

          if [ -z "$BETTER_AUTH_SECRET" ]; then
            BETTER_AUTH_SECRET="$(jq -r '.BETTER_AUTH_SECRET // empty' <<< "$EXISTING_SECRET")"
          fi

          if [ -z "$BETTER_AUTH_SECRET" ]; then
            BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
          fi

          SECRET_JSON="$(jq -n \
            --argjson existing "$EXISTING_SECRET" \
            --arg anthropic "$ANTHROPIC_API_KEY" \
            --arg database "$DATABASE_URL" \
            --arg mapbox "$MAPBOX_ACCESS_TOKEN" \
            --arg exa "$EXA_API_KEY" \
            --arg twitterClient "$TWITTER_CLIENT" \
            --arg twitterSecret "$TWITTER_SECRET" \
            --arg betterAuthUrl "$BETTER_AUTH_URL" \
            --arg betterAuthTrustedOrigins "$BETTER_AUTH_TRUSTED_ORIGINS" \
            --arg betterAuthSecret "$BETTER_AUTH_SECRET" \
            --arg langfusePublic "$LANGFUSE_PUBLIC_KEY" \
            --arg langfuseSecret "$LANGFUSE_SECRET_KEY" \
            --arg langfuseBaseUrl "$LANGFUSE_BASE_URL" \
            --arg sentryDsn "$SENTRY_DSN" \
            --arg sentryEnvironment "$SENTRY_ENVIRONMENT" \
            --arg sentryRelease "$SENTRY_RELEASE" \
            --arg sentryTracesSampleRate "$SENTRY_TRACES_SAMPLE_RATE" \
            --arg publicSentryDsn "$PUBLIC_SENTRY_DSN" \
            --arg publicSentryTracesSampleRate "$PUBLIC_SENTRY_TRACES_SAMPLE_RATE" \
            --arg publicSentryReplaysSessionSampleRate "$PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE" \
            --arg publicSentryReplaysOnErrorSampleRate "$PUBLIC_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE" \
            '$existing * ({
              ANTHROPIC_API_KEY: $anthropic,
              DATABASE_URL: $database,
              MAPBOX_ACCESS_TOKEN: $mapbox,
              EXA_API_KEY: $exa,
              TWITTER_CLIENT: $twitterClient,
              TWITTER_SECRET: $twitterSecret,
              BETTER_AUTH_URL: $betterAuthUrl,
              BETTER_AUTH_TRUSTED_ORIGINS: $betterAuthTrustedOrigins,
              BETTER_AUTH_SECRET: $betterAuthSecret,
              LANGFUSE_PUBLIC_KEY: $langfusePublic,
              LANGFUSE_SECRET_KEY: $langfuseSecret,
              LANGFUSE_BASE_URL: $langfuseBaseUrl,
              SENTRY_DSN: $sentryDsn,
              SENTRY_ENVIRONMENT: $sentryEnvironment,
              SENTRY_RELEASE: $sentryRelease,
              SENTRY_TRACES_SAMPLE_RATE: $sentryTracesSampleRate,
              PUBLIC_SENTRY_DSN: $publicSentryDsn,
              PUBLIC_SENTRY_TRACES_SAMPLE_RATE: $publicSentryTracesSampleRate,
              PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: $publicSentryReplaysSessionSampleRate,
              PUBLIC_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE: $publicSentryReplaysOnErrorSampleRate
            } | with_entries(select(.value != "")))')"

          aws secretsmanager describe-secret --secret-id "$APP_SECRET_NAME" >/dev/null 2>&1 \
            && aws secretsmanager put-secret-value --secret-id "$APP_SECRET_NAME" --secret-string "$SECRET_JSON" \
            || aws secretsmanager create-secret --name "$APP_SECRET_NAME" --secret-string "$SECRET_JSON"

      - name: Install CDK dependencies
        working-directory: infra-cdk
        run: npm ci

      - name: Validate CDK before deploy
        working-directory: infra-cdk
        run: npm test -- --runInBand && npm run build

      - name: Deploy serverless stack
        working-directory: infra-cdk
        env:
          IMAGE_TAG: ${{ github.sha }}
          APP_SECRET_NAME: ${{ env.APP_SECRET_NAME }}
        run: npx cdk deploy --require-approval never -c imageTag="$IMAGE_TAG"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID="$(aws cloudformation describe-stacks \
            --stack-name TheCrunchInfra \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)"

          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"

          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

      - name: Smoke test deployed app
        run: |
          DISTRIBUTION_DOMAIN="$(aws cloudformation describe-stacks \
            --stack-name TheCrunchInfra \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomainName`].OutputValue' \
            --output text)"

          APP_URL="https://${DISTRIBUTION_DOMAIN}"
          echo "Testing $APP_URL"

          curl --fail --show-error --silent --max-time 60 -D /tmp/the-crunch-headers.txt "$APP_URL/" >/tmp/the-crunch-home.html
          cat /tmp/the-crunch-headers.txt
          grep -q "The Crunch" /tmp/the-crunch-home.html

          status="$(curl --show-error --silent --max-time 60 \
            --request POST \
            --output /tmp/the-crunch-create.json \
            --write-out "%{http_code}" \
            "$APP_URL/api/chat/create")"

          if [ "$status" != "401" ]; then
            echo "Expected unauthenticated chat create to return 401, got $status"
            cat /tmp/the-crunch-create.json
            exit 1
          fi

      - name: Print Lambda logs on failure
        if: failure()
        run: |
          aws logs tail /aws/lambda/the-crunch-web --since 15m || true
