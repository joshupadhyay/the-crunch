name: Deploy serverless

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: the-crunch
  APP_SECRET_NAME: the-crunch/app-env

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::265058000489:role/github-actions-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --image-scanning-configuration scanOnPush=true

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Upsert runtime secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          TWITTER_CLIENT: ${{ secrets.TWITTER_CLIENT }}
          TWITTER_SECRET: ${{ secrets.TWITTER_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: |
          SECRET_JSON="$(jq -n \
            --arg anthropic "$ANTHROPIC_API_KEY" \
            --arg database "$DATABASE_URL" \
            --arg mapbox "$MAPBOX_ACCESS_TOKEN" \
            --arg twitterClient "$TWITTER_CLIENT" \
            --arg twitterSecret "$TWITTER_SECRET" \
            --arg betterAuthUrl "$BETTER_AUTH_URL" \
            --arg langfusePublic "$LANGFUSE_PUBLIC_KEY" \
            --arg langfuseSecret "$LANGFUSE_SECRET_KEY" \
            --arg langfuseBaseUrl "$LANGFUSE_BASE_URL" \
            '{
              ANTHROPIC_API_KEY: $anthropic,
              DATABASE_URL: $database,
              MAPBOX_ACCESS_TOKEN: $mapbox,
              TWITTER_CLIENT: $twitterClient,
              TWITTER_SECRET: $twitterSecret,
              BETTER_AUTH_URL: $betterAuthUrl,
              LANGFUSE_PUBLIC_KEY: $langfusePublic,
              LANGFUSE_SECRET_KEY: $langfuseSecret,
              LANGFUSE_BASE_URL: $langfuseBaseUrl
            } | with_entries(select(.value != ""))')"

          aws secretsmanager describe-secret --secret-id "$APP_SECRET_NAME" >/dev/null 2>&1 \
            && aws secretsmanager put-secret-value --secret-id "$APP_SECRET_NAME" --secret-string "$SECRET_JSON" \
            || aws secretsmanager create-secret --name "$APP_SECRET_NAME" --secret-string "$SECRET_JSON"

      - name: Install CDK dependencies
        working-directory: infra-cdk
        run: npm ci

      - name: Deploy serverless stack
        working-directory: infra-cdk
        env:
          IMAGE_TAG: ${{ github.sha }}
          APP_SECRET_NAME: ${{ env.APP_SECRET_NAME }}
        run: npx cdk deploy --require-approval never -c imageTag="$IMAGE_TAG"

      - name: Verify serverless endpoint
        run: |
          DISTRIBUTION_DOMAIN="$(aws cloudformation describe-stacks \
            --stack-name TheCrunchInfra \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" \
            --output text)"

          APP_URL="https://${DISTRIBUTION_DOMAIN}/"
          echo "Verifying ${APP_URL}"

          set +e
          curl -fsS -D /tmp/the-crunch-headers.txt "$APP_URL" -o /tmp/the-crunch-body.txt
          CURL_STATUS=$?
          set -e

          cat /tmp/the-crunch-headers.txt || true
          head -c 1000 /tmp/the-crunch-body.txt || true
          echo

          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "Endpoint verification failed; recent Lambda logs:"
            aws logs tail /aws/lambda/the-crunch-web --since 10m || true
            exit "$CURL_STATUS"
          fi

      - name: Smoke test deployed app
        run: |
          DISTRIBUTION_DOMAIN="$(aws cloudformation describe-stacks \
            --stack-name TheCrunchInfra \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomainName`].OutputValue' \
            --output text)"

          APP_URL="https://${DISTRIBUTION_DOMAIN}"
          echo "Testing $APP_URL"

          curl --fail --show-error --silent --max-time 60 "$APP_URL/" >/tmp/the-crunch-home.html
          grep -q "The Crunch" /tmp/the-crunch-home.html

          status="$(curl --show-error --silent --max-time 60 \
            --request POST \
            --output /tmp/the-crunch-create.json \
            --write-out "%{http_code}" \
            "$APP_URL/api/chat/create")"

          if [ "$status" != "401" ]; then
            echo "Expected unauthenticated chat create to return 401, got $status"
            cat /tmp/the-crunch-create.json
            exit 1
          fi

      - name: Print Lambda logs on failure
        if: failure()
        run: |
          aws logs tail /aws/lambda/the-crunch-web --since 15m || true
