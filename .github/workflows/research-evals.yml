name: Research evals

on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated OpenRouter model IDs to compare
        required: false
        default: deepseek/deepseek-v4-pro
      provider:
        description: Evaluation provider (openrouter or anthropic)
        required: false
        default: openrouter

permissions:
  contents: read

jobs:
  research-evals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate eval infrastructure
        run: |
          bun run typecheck
          bun run eval:contracts

      - name: Run research evals
        env:
          EVAL_MODELS: ${{ inputs.models }}
          EVAL_PROVIDER: ${{ inputs.provider }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_HTTP_REFERER: ${{ secrets.BETTER_AUTH_URL }}
          OPENROUTER_APP_TITLE: The Crunch
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          EVAL_FAIL_ON_ERROR: "true"
          EVAL_MIN_AVERAGE: "0.8"
        run: bun run eval:research

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-eval-report
          path: evals/reports/runs/
          if-no-files-found: error
          retention-days: 14
